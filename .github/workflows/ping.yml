# Weckruf für Supabase: Das Gratis-Projekt pausiert nach 7 Tagen ohne Anfragen.
# Montag und Donnerstag wird die Datenbank-Funktion `ping` aufgerufen (liest keine Daten).
# Schlägt das fehl (Projekt pausiert, Adresse falsch), ist der Lauf rot und GitHub mailt dem Verwalter.
#
# GitHub schaltet Zeitpläne in öffentlichen Repos nach 60 Tagen ohne Repo-Aktivität ab.
# Darum schaltet der zweite Schritt den Zeitplan selbst wieder ein (zählt als Aktivität),
# ganz ohne Commits.
#
# Adresse und Schlüssel sind öffentlich (publishable) und stehen auch in js/kern/server.js;
# tests/ping.test.js prüft, dass beide Stellen übereinstimmen. Der geheime Schlüssel gehört nie hierher.
name: Weckruf

on:
  schedule:
    - cron: '17 6 * * 1,4' # Montag und Donnerstag, 06:17 UTC
  workflow_dispatch: # zum Ausprobieren: Actions → Weckruf → Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SERVER_ADRESSE: https://ewvhbgpxlmnvaqjkobgo.supabase.co
      OEFFENTLICHER_SCHLUESSEL: sb_publishable_3FqMIFogQnjx0GYSNwQKsg_QSAGI1j2
    steps:
      - name: ping aufrufen
        run: |
          antwort=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            --request POST "$SERVER_ADRESSE/rest/v1/rpc/ping" \
            --header "apikey: $OEFFENTLICHER_SCHLUESSEL" \
            --header "Content-Type: application/json" \
            --data '{}')
          echo "Antwort: $antwort"
          test "$antwort" = '"ok"'

  zeitplan-aktiv-halten:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Zeitplan wieder einschalten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/ping.yml/enable"
