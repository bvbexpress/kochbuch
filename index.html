<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: nutzt auf dem iPhone auch den Bereich um die Notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kochbuch</title>
  <meta name="description" content="Teigrechner für Brot, Pizza und Focaccia">

  <!-- Sagt dem Browser, dass die Seite hell und dunkel kann (Formularfelder, Scrollbalken) -->
  <meta name="color-scheme" content="light dark">
  <!-- Farbe der Statusleiste auf dem Handy, passend zum Modus -->
  <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1814" media="(prefers-color-scheme: dark)">

  <!-- Wichtig: alle Pfade relativ (./), weil GitHub Pages die App unter /kochbuch/ ausliefert -->
  <!-- Homescreen-App: Name, Icon, Vollbild -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Kochbuch">

  <link rel="stylesheet" href="./css/basis.css">
  <link rel="stylesheet" href="./css/teig.css">

  <!-- type="module": der Browser lädt import/export selbst, ohne Build-Tool -->
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <!-- Erscheint, wenn eine neue Version geladen ist (siehe js/kern/aktualisierung.js) -->
  <div id="update" class="update karte" role="status" hidden>
    <span>Neue Version da</span>
    <button type="button" class="knopf knopf-voll">Jetzt laden</button>
  </div>

  <!-- Hier setzt app.js den jeweiligen Bereich ein (Teigrechner, später Rezepte, Vorrat) – samt Überschrift -->
  <main id="inhalt" class="inhalt">
    <noscript>Der Teigrechner braucht JavaScript.</noscript>
  </main>

  <footer class="fuss leise"><small id="version"></small></footer>
</body>
</html>
